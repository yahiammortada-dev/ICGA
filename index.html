function botAct(a){
  const g=DB.game;
  switch(T.phase){
    case 'skip': return endTurn();
    case 'obst': return startObstacle();
    case 'draw': {
      if(!T.botPow){ T.botPow=true;
        const opts=a.hand.filter(k=>POWERS[k].when==='turn' && k!=='mirror' && canUseNow(a,k).ok);
        if(opts.length && Math.random()<0.5){ const k=rnd(opts), P=POWERS[k];
          if(P.tg){ const ts=targetsFor(a,P.tg); if(ts.length){ const t=rnd(ts); payFor(a,k); toast(`${a.name} استخدم «${P.name}» على ${t.name}`); if(blockedByProtection(t,k)){ save(); return renderPlay(); } return applyTargetEffect(k,a,t); } }
          else { toast(`${a.name} استخدم «${P.name}»`); return useTurnPower(a,k); } }
      }
      if(!T.botCh){ T.botCh=true; const ca=chAvail(a);
        if(ca.cats.length && Math.random()<0.35){ const ks=['duel','chain','auction','all','fastest','survive'].filter(k=>ca.cats.includes(CHALLENGES[k].cat) && isUnlocked(k));
          if(ks.length){ const k=rnd(ks); toast(`${a.name} اختار تحدي «${CHALLENGES[k].name}»`); return pickChCard(k); } }
      }
      const lv=[1,2,3].filter(n=>n!==a.lastLvl); return pickLevel(rnd(lv));
    }
    case 'chSetup': {
      const C=CHALLENGES[T.key];
      if(C.tg && !T.tgt){ const ts=chTargets(a,C.tg,T.key); if(!ts.length){ T={phase:'draw',botCh:true,botPow:true}; return renderPlay(); } T.tgt=rnd(ts).id; }
      if(!T.S) setChSq(a.bot==='easy' ? rint(1,2) : rint(1,3));
      return confirmChSetup();
    }
    case 'answer': {
      if(!QS.answered){
        if(T.mode==='normal' && a.id===cur().id){
          for(const k of ['fifty','double']){ if(a.hand.includes(k) && !QS.usedP[k] && canUseNow(a,k).ok && Math.random()<0.5){ toast(`${a.name} استخدم «${POWERS[k].name}»`); return usePower(a.id,k); } }
        }
        return answer(botAnswerIdx(a));
      }
      T.botOb=true; const ca=chAvail(a);
      if(ca.cats.includes('k') && Math.random()<0.3){ const ks=Object.keys(CHALLENGES).filter(k=>CHALLENGES[k].cat==='k' && k!=='reveal' && isUnlocked(k)); const k=rnd(ks);
        pickChCard(k); const ts=obstTargets(a); if(!ts.length) return renderPlay(); T.tgt=rnd(ts).id; return confirmChSetup(); }
      return renderPlay();
    }
    case 'handq': return beginHandQ();
    case 'buy': {
      const gs=['k','d','f'].filter(x=>canBuy(a,x));
      if(gs.length && Math.random()<0.7) return buyFrom(gs[0]);
      return endTurn();
    }
    case 'ch': {
      const st=T.ch.steps[T.ch.idx];
      if(st.kind==='q'){ if(QS && !QS.answered) return answer(botAnswerIdx(a)); return chNext(); }
      if(st.kind==='num'){ const v=st.q.a, err=a.bot==='easy'?0.35:0.06; chRecord({val:Math.max(0,Math.round(v*(1+(Math.random()*2-1)*err))),time:1}); return chNext(); }
      if(st.kind==='bid'){ st.bid = a.bot==='easy' ? 1 : rint(2,3); return bidConfirm(); }
      if(st.kind==='reveal'){ const t=pById(T.ch.target); return revealBlock(t.hand.length?rnd(t.hand):null); }
      return chNext();
    }
  }
}

    qt = `<div class="clues">${QS.q.who.slice(0,n).map((c,i)=>`<div class="clue"><b>${i+1}</b>${esc(c)}</div>`).join('')}${n<QS.q.who.length?`<button class="clue more" onclick="whoMoreQ()"><b>${n+1}</b>دوس عشان تشوف التلميح ${n===1?'التاني':'التالت'}</button>`:''}</div>`; }

function optsHtml(revealNow){

    if(QS.answered){
      if(!revealNow) c += i===QS.choice?' picked':' dim';
      else if(o.ok && !QS.reverse) c+=' correct';
      else if(QS.reverse && i===QS.choice) c+= isOk?' correct':' wrong';
      else if(i===QS.choice) c+=' wrong';
      else if(QS.reverse && o.ok) c+=' dim';
      else c+=' dim';
    }
    const txt = (QS.hidden && !QS.answered) ? '؟؟؟' : esc(o.t);
    const mark = (QS.answered && revealNow) ? (o.ok ? ic('check','oi') : (i===QS.choice ? ic('x','oi') : '')) : '';
    return `<button class="opt ${c}" onclick="answer(${i})" ${QS.answered||gone?'disabled':''}><span class="k">${KEYS[i]}</span><span class="t">${txt}</span>${mark}</button>`;
  }).join('')}</div>`;

        else extra += `<div class="fb neutral pop"><div class="fb-title">تم تسجيل إجابتك</div><div class="why">النتيجة هتظهر لما التحدي يخلص</div></div>`;

    case 'letter': {
      const A=pById(ch.drawer), B=pById(ch.target);
      const top = `<div class="bigword pop"><div style="font-size:18px;opacity:.85">${esc(st.l.t)}</div>«${esc(st.l.l)}»</div>`;

function stageChResult(){
  const ch=T.ch, o=T.out, C=CHALLENGES[ch.key];
  const endLbl = ch.ctx==='obst' ? 'كمّل دورك' : 'إنهاء الدور';
  if(o.refused) return `${challengeCard(ch.key,{S:ch.S,noLock:true})}<div class="verdict">${esc(pById(ch.target).name)} رفض ${ch.ctx==='obst'?'العقبة':'التحدي'}</div><p class="note">استخدم كارت «رد التحدي»، فمحدش كسب ولا خسر.</p><button class="btn primary big" onclick="afterCh()">${endLbl}</button>`;
  const ids=Object.keys(o.raw);
  const rows = ids.length ? ids.map(id=>{ const p=pById(id), v=o.fin[id]; return `<div class="drow">${av(p,38)}<div class="info"><div class="nm" style="font-size:17px">${esc(p.name)}</div></div><span class="dv2 ${v>0?'plus':v<0?'minus':''}">${v>0?'+':''}${v} ${ptsWord(v)}</span></div>`; }).join('') : `<p class="note">محدش كسب ولا خسر نقاط.</p>`;
  const qs=[]; ch.res.filter(r=>r.kind==='q' && r.q).forEach(r=>{ if(!qs.includes(r.q)) qs.push(r.q); });
  const answers = qs.length ? qs.slice(-3).map(q=>`<div class="reveal box">${ic('search')}<span>${esc(q.q)}<br><b>${esc(q.a[0])}</b></span></div>`).join('') : '';
  const big = ch.key==='surp' && ch.meta.surprise ? `<div class="surpbig pop"><b>+${ch.meta.surprise}</b><span>نقاط</span></div>` : '';
  if(ch.key==='auction' && ch.meta.au){ const au=ch.meta.au, w=au.w, l=w?au.rows.find(r=>r.id!==w).id:null;
    return `<div class="pop" style="display:grid;gap:12px"><div class="verdict">نتيجة المزاد</div>
    ${au.rows.map(r=>`<div class="aurow"><div class="info"><b>${esc(pById(r.id).name)}</b><small>طلب ${r.bid}، وجاوب ${r.sc} من 3</small></div><span class="aupill ${r.ok?'ok':'no'}">${r.ok?'وصل':'ما وصلش'}</span></div>`).join('')}
    <div class="auwin"><b>${w?esc(pById(w).name)+' كسب':au.tie?'تعادل':'محدش كسب'}</b>${w?`<span>+${o.fin[w]||0} ${ptsWord(o.fin[w]||0)} لـ${esc(pById(w).name)} و${o.fin[l]||0} ${ptsWord(o.fin[l]||0)} لـ${esc(pById(l).name)}</span>`:`<span>${au.tie?'الاتنين وصلوا بنفس العدد':'محدش وصل لعدده'}</span>`}</div>
    ${o.mods.map(m=>`<p class="note">${esc(m)}</p>`).join('')}<p class="note">كل واحد جاوب نفس الـ3 أسئلة لوحده.</p>
    ${canRedo()?`<button class="btn dark" onclick="redoCh()">${ic('repeat')} استخدم كارت «إعادة التحدي»</button>`:''}
    <button class="btn primary big" onclick="afterCh()">${endLbl}</button></div>`; }
  return `<div class="pop" style="display:grid;gap:12px"><div class="verdict">نتيجة ${ch.ctx==='obst'?'العقبة':'تحدي'} ${C.name}</div>${big}${o.note?`<p class="note">${esc(o.note)}</p>`:''}<div class="deltas">${rows}</div>${o.mods.map(m=>`<p class="note">${esc(m)}</p>`).join('')}${answers}
  ${canRedo()?`<button class="btn dark" onclick="redoCh()">${ic('repeat')} استخدم كارت «إعادة التحدي»</button>`:''}
  <button class="btn primary big" onclick="afterCh()">${endLbl}</button></div>`;
}

R.results = () => {

/* ================== احتفال ================== */
function confetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#confetti'), x=c.getContext('2d'), d=window.devicePixelRatio||1;
  const W=c.width=innerWidth*d, H=c.height=innerHeight*d; c.style.display='block';
  const cols=['#f5b521','#2f4ff0','#ff6a3d','#2bb565','#7a4a25','#e2264a'];
  const P=Array.from({length:150},()=>({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*3*d,vy:(2+Math.random()*4)*d,s:(6+Math.random()*7)*d,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:rnd(cols)}));
  const t0=performance.now();
  (function f(t){ x.clearRect(0,0,W,H); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(t-t0<3800) requestAnimationFrame(f); else { x.clearRect(0,0,W,H); c.style.display='none'; } })(t0);
}
